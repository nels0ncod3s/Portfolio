<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>

		<!-- Resolve the theme before first paint so light-mode users never see a dark flash. -->
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
					document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark');
				} catch (e) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
